<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141b33"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd54a"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffd54a"/></marker>
  </defs>
  <rect width="960" height="360" rx="20" fill="url(#bg)"/>
  <text x="480" y="44" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">What lands in Kenji after push_to_kenji.py --push</text>

  <!-- CSV box -->
  <rect x="30" y="68" width="200" height="210" rx="16" fill="#1b2442" stroke="#2c3866"/>
  <text x="130" y="96" text-anchor="middle" fill="#ffd54a" font-weight="700" font-size="15">leads.csv</text>
  <g font-size="11" fill="#c9d1e8" text-anchor="middle">
    <text x="130" y="120">Sample Detailing Co</text>
    <text x="130" y="138">Demo Lawn Services</text>
    <text x="130" y="156">Example Pressure Wash</text>
    <text x="130" y="174">...</text>
    <text x="130" y="202" fill="#8f9bc4">phones already</text>
    <text x="130" y="219" fill="#8f9bc4">in Kenji skipped</text>
    <text x="130" y="236" fill="#8f9bc4">automatically</text>
  </g>
  <rect x="30" y="290" width="200" height="2" fill="#2c3866"/>

  <!-- Arrow -->
  <g stroke="#ffd54a" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M232,173 L290,173"/>
  </g>

  <!-- Kenji CRM box -->
  <rect x="292" y="68" width="420" height="210" rx="16" fill="#1b2442" stroke="#2c3866"/>
  <text x="502" y="96" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">Kenji AI Contacts</text>

  <!-- Contact cards -->
  <rect x="314" y="108" width="368" height="50" rx="10" fill="#0b1020" stroke="#2c3866"/>
  <text x="334" y="128" fill="#ffd54a" font-size="13" font-weight="700">Sample Detailing Co</text>
  <text x="334" y="147" fill="#8f9bc4" font-size="11">(555) 010-0001  |  123 Main St, Austin TX</text>
  <rect x="604" y="114" width="68" height="20" rx="10" fill="#1e3a5f"/>
  <text x="638" y="128" text-anchor="middle" fill="#ffd54a" font-size="10">no-website</text>

  <rect x="314" y="164" width="368" height="50" rx="10" fill="#0b1020" stroke="#2c3866"/>
  <text x="334" y="184" fill="#ffd54a" font-size="13" font-weight="700">Demo Lawn Services</text>
  <text x="334" y="203" fill="#8f9bc4" font-size="11">(555) 010-0002  |  456 Oak Ave, Dallas TX</text>
  <rect x="604" y="170" width="68" height="20" rx="10" fill="#1e3a5f"/>
  <text x="638" y="184" text-anchor="middle" fill="#ffd54a" font-size="10">no-website</text>

  <rect x="314" y="220" width="368" height="40" rx="10" fill="#141d38" stroke="#2c3866"/>
  <text x="334" y="244" fill="#8f9bc4" font-size="11">+ note with Maps link, category, site status, next step</text>

  <!-- Arrow to call pipeline -->
  <g stroke="#ffd54a" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M714,173 L756,173"/>
  </g>

  <!-- Next step -->
  <rect x="758" y="90" width="170" height="170" rx="16" fill="url(#gold)"/>
  <text x="843" y="148" text-anchor="middle" fill="#0b1020" font-weight="800" font-size="22">Call list</text>
  <text x="843" y="172" text-anchor="middle" fill="#0b1020" font-size="13">ready to work</text>
  <text x="843" y="193" text-anchor="middle" fill="#0b1020" font-size="13">in your CRM</text>
  <text x="843" y="218" text-anchor="middle" fill="#0b1020" font-size="12">pitch: free website</text>
  <text x="843" y="236" text-anchor="middle" fill="#0b1020" font-size="12">+ Kenji AI tools</text>

  <text x="480" y="315" text-anchor="middle" fill="#8f9bc4" font-size="13">source field = "no-website-finder" so you can filter these contacts in Kenji any time</text>
</svg>
